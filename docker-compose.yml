version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: grocery
      POSTGRES_DB: grocery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
